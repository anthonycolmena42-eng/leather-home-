<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leather Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* 1rem = 1px of a 1920-wide screen, so the layout scales to any TV */
  html { font-size: calc(100vw / 1920); }
  :root {
    --espresso: #120b07; --mahogany: #2a150b; --chocolate: #3b2012;
    --cognac: #8a4a22; --tobacco: #a5662f; --orange: #d4651c; --ember: #ff8a3d;
    --cream: #efe3cf; --muted: #b9a68d; --silver: #c9c6c0;
    --serif: 'Playfair Display', 'Didot', Georgia, serif;
    --sans: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 100vw; height: 100vh; overflow: hidden; color: var(--cream);
    font-family: var(--sans); background: var(--espresso);
    -webkit-font-smoothing: antialiased; cursor: none;
  }
  /* warm amber key light + leather grain + vignette */
  .room {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 14% 6%, rgba(212,101,28,.28), transparent 60%),
      radial-gradient(ellipse 60% 50% at 92% 100%, rgba(138,74,34,.30), transparent 65%),
      linear-gradient(160deg, #1d0f08 0%, #120b07 55%, #0b0604 100%);
  }
  .grain { position: fixed; inset: 0; opacity: .22; mix-blend-mode: overlay; pointer-events: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.65) 100%); }

  main { position: relative; height: 100%; padding: 72rem 96rem 64rem; display: grid;
    grid-template-columns: 1fr 600rem; grid-template-rows: auto 1fr; column-gap: 80rem; }
  main > section:first-child { grid-column: 1; grid-row: 1; }

  /* ---------- clock / date / weather ---------- */
  .kicker { font: 600 15rem/1 var(--sans); letter-spacing: .42em; text-transform: uppercase; color: var(--tobacco); }
  .clock { font: 700 170rem/0.95 var(--serif); letter-spacing: -.02em; margin-top: 22rem;
    color: var(--cream); text-shadow: 0 2rem 0 rgba(255,255,255,.06), 0 30rem 60rem rgba(0,0,0,.7); }
  .clock .ampm { font: italic 500 54rem/1 var(--serif); color: var(--orange); margin-left: 14rem; letter-spacing: 0; }
  .date { font: italic 500 36rem/1.2 var(--serif); color: var(--muted); margin-top: 14rem; }
  .weather { display: inline-flex; align-items: center; gap: 22rem; margin-top: 28rem; padding: 16rem 30rem 16rem 18rem;
    border-radius: 60rem; background: linear-gradient(180deg, #3a1f10, #24130a);
    box-shadow: inset 0 1rem 0 rgba(255,220,180,.12), inset 0 -2rem 6rem rgba(0,0,0,.5), 0 18rem 40rem rgba(0,0,0,.55); }
  .weather .orb { width: 64rem; height: 64rem; border-radius: 50%; display: grid; place-items: center; font-size: 32rem;
    background: radial-gradient(circle at 35% 30%, #ffb070, var(--orange) 45%, #6a2a0a 100%);
    box-shadow: 0 8rem 22rem rgba(212,101,28,.45), inset 0 -4rem 8rem rgba(0,0,0,.35); }
  .weather .temp { font: 700 46rem/1 var(--serif); }
  .weather .desc { font: 500 20rem/1.3 var(--sans); color: var(--cream); }
  .weather .meta { font: 400 16rem/1.3 var(--sans); color: var(--muted); letter-spacing: .04em; }

  /* ---------- focus card (stitched leather) ---------- */
  .focus { grid-column: 2; grid-row: 1; align-self: start; position: relative; padding: 34rem 40rem 30rem; border-radius: 28rem;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,190,130,.18), transparent 55%),
      linear-gradient(155deg, #9a5426 0%, #6e3415 55%, #4a210c 100%);
    box-shadow: inset 0 2rem 0 rgba(255,225,190,.25), inset 0 -10rem 30rem rgba(0,0,0,.35),
      0 50rem 90rem rgba(0,0,0,.7), 0 14rem 24rem rgba(0,0,0,.5);
    transform: rotate(-1.2deg); }
  .focus::before { content: ''; position: absolute; inset: 14rem; border-radius: 18rem;
    border: 2rem dashed rgba(255,214,170,.45); pointer-events: none; }
  .focus .grain-in { position: absolute; inset: 0; border-radius: 28rem; opacity: .35; mix-blend-mode: multiply; pointer-events: none; }
  .focus h2 { font: italic 500 40rem/1 var(--serif); color: #fff3e2; text-shadow: 0 2rem 4rem rgba(0,0,0,.4); position: relative; }
  .focus .sub { font: 600 13rem/1 var(--sans); letter-spacing: .36em; text-transform: uppercase; color: rgba(255,226,196,.7); margin: 10rem 0 16rem; position: relative; }
  .focus ul { list-style: none; position: relative; display: grid; gap: 4rem; }
  .focus li { display: flex; align-items: center; gap: 20rem; padding: 10rem 16rem; border-radius: 14rem;
    font: 500 23rem/1.25 var(--sans); color: #fff1de; transition: transform .18s, background .18s, box-shadow .18s; }
  .focus li .box { flex: none; width: 30rem; height: 30rem; border-radius: 50%; border: 2rem solid rgba(255,226,196,.75);
    display: grid; place-items: center; font-size: 18rem; color: transparent;
    box-shadow: inset 0 2rem 4rem rgba(0,0,0,.35); }
  .focus li.done { color: rgba(255,236,214,.5); text-decoration: line-through; text-decoration-color: rgba(255,214,170,.6); }
  .focus li.done .box { background: var(--cream); color: #5b2a0e; border-color: var(--cream); }
  .focus li.focused { background: rgba(18,11,7,.42); transform: translateX(8rem);
    box-shadow: inset 0 0 0 2rem var(--ember), 0 10rem 24rem rgba(0,0,0,.35); }
  .focus .empty { font: 400 19rem/1.5 var(--sans); color: rgba(255,236,214,.75); position: relative; }
  .focus .empty code { font: 500 17rem/1 ui-monospace, Menlo, monospace; background: rgba(0,0,0,.3); padding: 3rem 8rem; border-radius: 6rem; }

  /* ---------- app rows ---------- */
  .shelves { grid-column: 1 / span 2; align-self: end; }
  .shelf-title { display: flex; align-items: baseline; gap: 18rem; margin: 0 0 4rem 6rem; }
  .shelf-title h3 { font: italic 500 34rem/1 var(--serif); color: var(--cream); }
  .shelf-title span { font: 600 13rem/1 var(--sans); letter-spacing: .38em; text-transform: uppercase; color: var(--tobacco); }
  .row { display: flex; gap: 28rem; padding: 30rem 18rem 34rem; margin: 0 -12rem; overflow: hidden; scroll-behavior: smooth; }
  .tile { flex: none; position: relative; width: 262rem; height: 147rem; border-radius: 18rem; overflow: hidden;
    background: linear-gradient(160deg, #3b2012, #1f1009);
    box-shadow: inset 0 1rem 0 rgba(255,220,180,.15), 0 26rem 50rem rgba(0,0,0,.65), 0 8rem 14rem rgba(0,0,0,.5);
    transition: transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .label { position: absolute; inset: auto 0 0 0; padding: 40rem 18rem 14rem; font: 600 19rem/1.1 var(--sans);
    background: linear-gradient(transparent, rgba(10,5,3,.85)); color: var(--cream); }
  .tile .letter { position: absolute; inset: 0; display: grid; place-items: center; font: italic 700 72rem/1 var(--serif); color: rgba(239,227,207,.9); }
  .tile .icon { position: absolute; top: 26rem; left: 50%; width: 76rem; height: 76rem; transform: translateX(-50%); object-fit: contain; }
  .tile::after { content: ''; position: absolute; inset: 0; border-radius: 18rem; pointer-events: none;
    background: linear-gradient(155deg, rgba(255,255,255,.16), transparent 38%); }
  .tile.focused { transform: translateY(-14rem) scale(1.08); z-index: 2;
    box-shadow: 0 0 0 4rem var(--orange), 0 0 46rem rgba(255,138,61,.55), 0 46rem 80rem rgba(0,0,0,.8); }
  .row.small .tile { width: 210rem; height: 118rem; }
  .row.small .tile .label { font-size: 16rem; padding: 30rem 14rem 10rem; }
  .row.small .tile .letter { font-size: 52rem; }
  .row.small .tile .icon { width: 56rem; height: 56rem; top: 16rem; }
  .tile.settings { background: linear-gradient(160deg, #50505a, #2a2a30); }
  .tile.settings .letter { font: 400 60rem/1 var(--sans); color: var(--silver); font-style: normal; }

  .hint { position: absolute; right: 96rem; top: 76rem; font: 500 14rem/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: rgba(185,166,141,.55); }
</style>
</head>
<body>
<div class="room"></div>
<svg class="grain" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .35  0 0 0 0 .2  0 0 0 1 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="vignette"></div>

<main>
  <section>
    <div class="kicker">Leather Home · Vol. 01</div>
    <div class="clock"><span id="time">9:41</span><span class="ampm" id="ampm">pm</span></div>
    <div class="date" id="date">Thursday, the 12th of November</div>
    <div class="weather" id="weather">
      <div class="orb" id="wicon">·</div>
      <div>
        <div style="display:flex;align-items:baseline;gap:16rem"><span class="temp" id="wtemp">--°</span><span class="desc" id="wdesc">Fetching the sky…</span></div>
        <div class="meta" id="wmeta">New Haven</div>
      </div>
    </div>
  </section>

  <aside class="focus">
    <svg class="grain-in" width="100%" height="100%"><rect width="100%" height="100%" filter="url(#n)"/></svg>
    <h2>Today's Focus</h2>
    <div class="sub" id="fcount">Press OK to check off</div>
    <ul id="focus"></ul>
  </aside>

  <section class="shelves">
    <div class="shelf-title"><h3>Watch &amp; Listen</h3><span>Your rotation</span></div>
    <div class="row" id="favs"></div>
    <div class="shelf-title"><h3>Library</h3><span>Everything else</span></div>
    <div class="row small" id="rest"></div>
  </section>
</main>

<script>
/* ---------- data ---------- */
const FAVS = ['com.netflix.ninja','com.google.android.youtube.tv','com.hulu.livingroomplus',
              'com.wbd.stream','com.disney.disneyplus','com.spotify.tv.android'];
const WEATHER = { lat: 41.31, lon: -72.93, place: 'New Haven' };

const onTV = typeof window.Home !== 'undefined';
const Bridge = onTV ? window.Home : {   // browser preview: fake data
  apps: () => JSON.stringify([
    ['Netflix','com.netflix.ninja'],['YouTube','com.google.android.youtube.tv'],['Hulu','com.hulu.livingroomplus'],
    ['Max','com.wbd.stream'],['Disney+','com.disney.disneyplus'],['Spotify','com.spotify.tv.android'],
    ['Google Play Store','com.android.vending'],['Live TV','com.mediatek.wwtv.tvcenter'],['Media Player','com.mediatek.wwtv.mediaplayer'],
    ['TV Bro','com.phlox.tvwebbrowser']].map(([name,pkg]) => ({name, pkg, banner:'', icon:''}))),
  launch: p => console.log('launch', p), settings: () => console.log('settings'),
  getFocus: () => localStorage.getItem('focus') || JSON.stringify([
    {t:'Finish the essay draft',done:false},{t:'Read 20 pages',done:true},
    {t:'Workout',done:false},{t:'Call home',done:false}]),
  setFocus: j => localStorage.setItem('focus', j)
};

/* ---------- clock ---------- */
const ord = n => n + (n%100>10&&n%100<14 ? 'th' : ({1:'st',2:'nd',3:'rd'}[n%10] || 'th'));
function tick() {
  const d = new Date(); let h = d.getHours();
  document.getElementById('time').textContent = ((h % 12) || 12) + ':' + String(d.getMinutes()).padStart(2,'0');
  document.getElementById('ampm').textContent = h < 12 ? 'am' : 'pm';
  document.getElementById('date').textContent =
    d.toLocaleDateString('en-US',{weekday:'long'}) + ', the ' + ord(d.getDate()) + ' of ' + d.toLocaleDateString('en-US',{month:'long'});
}

/* ---------- weather (Open-Meteo, no key) ---------- */
const WMO = c => c===0?['Clear','☀']:c<=2?['Partly cloudy','◐']:c===3?['Overcast','☁']:c<=48?['Fog','≋']
  :c<=57?['Drizzle','☂']:c<=67?['Rain','☂']:c<=77?['Snow','❄']:c<=82?['Showers','☂']:c<=86?['Snow showers','❄']:['Thunderstorms','ϟ'];
async function weather() {
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER.lat}&longitude=${WEATHER.lon}`
      + `&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min`
      + `&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=1`;
    const r = await (await fetch(u)).json();
    const [desc, ic] = WMO(r.current.weather_code);
    wtemp.textContent = Math.round(r.current.temperature_2m) + '°';
    wdesc.textContent = desc; wicon.textContent = ic;
    wmeta.textContent = `${WEATHER.place} · H ${Math.round(r.daily.temperature_2m_max[0])}°  L ${Math.round(r.daily.temperature_2m_min[0])}°`;
  } catch (e) { wdesc.textContent = 'Weather offline'; }
}

/* ---------- focus list ---------- */
let focusItems = [];
function renderFocus() {
  focusItems = JSON.parse(Bridge.getFocus() || '[]');
  const ul = document.getElementById('focus'); ul.innerHTML = '';
  if (!focusItems.length) {
    ul.innerHTML = `<li class="empty" style="display:block">Nothing set yet. From your Mac:<br><code>./tv.sh focus "Task one" "Task two"</code></li>`;
  }
  focusItems = focusItems.slice(0, 5);
  focusItems.forEach((it, i) => {
    const li = document.createElement('li'); li.dataset.f = 1; li.className = it.done ? 'done' : '';
    li.innerHTML = `<span class="box">✓</span><span></span>`; li.lastChild.textContent = it.t;
    li.onclick = () => { focusItems[i].done = !focusItems[i].done; Bridge.setFocus(JSON.stringify(focusItems)); li.classList.toggle('done'); count(); };
    ul.appendChild(li);
  });
  count();
}
function count() {
  const d = focusItems.filter(x => x.done).length;
  fcount.textContent = focusItems.length ? `${d} of ${focusItems.length} done · OK to check off` : 'Set from your Mac';
}

/* ---------- app tiles ---------- */
function tile(app, small) {
  const t = document.createElement('div'); t.className = 'tile'; t.dataset.f = 1;
  if (app.banner) t.innerHTML = `<img src="${app.banner}" alt="">`;
  else {
    if (app.icon) t.innerHTML = `<img class="icon" src="${app.icon}" alt="">`;
    else t.innerHTML = `<div class="letter">${app.name[0]}</div>`;
    t.innerHTML += `<div class="label"></div>`; t.querySelector('.label').textContent = app.name;
  }
  t.onclick = () => Bridge.launch(app.pkg);
  return t;
}
function renderApps() {
  const apps = JSON.parse(Bridge.apps());
  const favs = FAVS.map(p => apps.find(a => a.pkg === p)).filter(Boolean);
  const rest = apps.filter(a => !FAVS.includes(a.pkg)).sort((a,b) => a.name.localeCompare(b.name));
  favsEl.innerHTML = ''; restEl.innerHTML = '';
  favs.forEach(a => favsEl.appendChild(tile(a)));
  rest.forEach(a => restEl.appendChild(tile(a, true)));
  const s = document.createElement('div'); s.className = 'tile settings'; s.dataset.f = 1;
  s.innerHTML = `<div class="letter">⚙</div><div class="label">Settings</div>`; s.onclick = () => Bridge.settings();
  restEl.appendChild(s);
}
const favsEl = document.getElementById('favs'), restEl = document.getElementById('rest');

/* ---------- remote navigation (arrow keys + OK) ---------- */
let cur = null;
function setCur(el) {
  if (!el) return;
  if (cur) cur.classList.remove('focused');
  cur = el; cur.classList.add('focused');
  const row = el.closest('.row');
  if (row) {   // keep the focused tile in view inside its row
    const l = el.offsetLeft - row.offsetLeft, r = l + el.offsetWidth;
    if (r > row.scrollLeft + row.clientWidth - 40) row.scrollLeft = r - row.clientWidth + 60;
    if (l < row.scrollLeft + 20) row.scrollLeft = Math.max(0, l - 40);
  }
}
function move(dir) {
  const all = [...document.querySelectorAll('[data-f]')];
  if (!cur || !document.body.contains(cur)) return setCur(favsEl.firstChild || all[0]);
  const a = cur.getBoundingClientRect(), ax = a.left + a.width/2, ay = a.top + a.height/2;
  let best = null, bestScore = Infinity;
  for (const el of all) {
    if (el === cur) continue;
    const b = el.getBoundingClientRect(), bx = b.left + b.width/2, by = b.top + b.height/2;
    const dx = bx - ax, dy = by - ay;
    const ok = dir==='ArrowRight' ? dx > 10 : dir==='ArrowLeft' ? dx < -10 : dir==='ArrowDown' ? dy > 10 : dy < -10;
    if (!ok) continue;
    const main = (dir==='ArrowLeft'||dir==='ArrowRight') ? Math.abs(dx) : Math.abs(dy);
    const side = (dir==='ArrowLeft'||dir==='ArrowRight') ? Math.abs(dy) : Math.abs(dx);
    const score = main + side * 2.2;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  if (best) setCur(best);
}
document.addEventListener('keydown', e => {
  if (e.key.startsWith('Arrow')) { e.preventDefault(); move(e.key); }
  else if (e.key === 'Enter' || e.keyCode === 23) { e.preventDefault(); cur && cur.click(); }
});

/* ---------- boot ---------- */
window.refresh = () => { renderFocus(); renderApps(); cur = null; setCur(favsEl.firstChild); };
tick(); setInterval(tick, 5000);
weather(); setInterval(weather, 30 * 60 * 1000);
refresh();
</script>
</body>
</html>
